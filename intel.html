<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evo · 情报台</title>
  <style>
    :root { --bg:#f6f6f4; --card:#fff; --text:#1c1c1c; --muted:#6b6b6b; --line:#e8e8e4; --accent:#1f4d3a; --tag:#f0efe9; }
    body.sea { --accent:#163a5f; }
    body.auto { --accent:#7a2e12; }
    body.dark { --bg:#121212; --card:#1b1b1b; --text:#eee; --muted:#9a9a9a; --line:#2c2c2c; --tag:#2a2a2a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"PingFang SC","Microsoft YaHei",Helvetica,sans-serif; background:var(--bg); color:var(--text); }
    a { color:inherit; }
    .top { position:sticky; top:0; z-index:20; display:flex; justify-content:space-between; align-items:center; padding:14px 24px; background:var(--bg); border-bottom:1px solid var(--line); }
    .pills { display:flex; gap:8px; flex-wrap:wrap; }
    .pill { border:1px solid var(--line); background:var(--card); padding:6px 12px; border-radius:999px; cursor:pointer; font-size:13px; }
    .pill.on { background:var(--accent); color:#fff; border-color:var(--accent); }
    .hero { max-width:1040px; margin:0 auto; padding:28px 24px 8px; }
    .kicker { color:var(--accent); font-size:12px; letter-spacing:2px; font-weight:600; }
    h1 { font-size:28px; font-weight:560; margin:8px 0 8px; }
    .lead { color:var(--muted); max-width:760px; line-height:1.7; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:1040px; margin:18px auto; padding:0 24px; }
    .stat { background:var(--card); border:1px solid var(--line); padding:14px; border-radius:12px; }
    .stat b { display:block; font-size:20px; }
    .stat span { color:var(--muted); font-size:12px; }
    .tabs { max-width:1040px; margin:0 auto; padding:0 24px; display:flex; gap:4px; flex-wrap:wrap; }
    .tab { border:0; background:none; padding:8px 12px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; }
    .tab.on { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
    .list { max-width:1040px; margin:16px auto 80px; padding:0 24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
    .src { font-size:12px; color:var(--muted); }
    .title { font-size:16px; font-weight:600; margin:6px 0; }
    .insight { font-size:14px; color:var(--muted); line-height:1.7; }
    .tags { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
    .tag { font-size:12px; background:var(--tag); padding:2px 8px; border-radius:99px; color:var(--muted); }
    table { width:100%; border-collapse:collapse; font-size:13px; background:var(--card); }
    th,td { border:1px solid var(--line); padding:8px; text-align:center; }
    th { background:var(--tag); font-weight:500; }
    td.l { text-align:left; font-weight:600; }
    .hi { background:#efe7d6; }
    body.dark .hi { background:#3a2a18; }
    .lo { color:var(--muted); }
    .note { font-size:12px; color:var(--muted); margin-top:10px; line-height:1.6; }
    @media(max-width:720px){ .stats{grid-template-columns:1fr 1fr;} h1{font-size:22px;} }
  </style>
</head>
<body>
  <header class="top">
    <a href="index.html" style="font-weight:650;text-decoration:none">Evo · 情报台</a>
    <div class="pills">
      <button class="pill on" id="b-fin" onclick="setSys('fin')">金镜</button>
      <button class="pill" id="b-sea" onclick="setSys('sea')">海镜</button>
      <button class="pill" id="b-auto" onclick="setSys('auto')">车海</button>
      <button class="pill" onclick="document.body.classList.toggle('dark')">暗色</button>
    </div>
  </header>
  <section class="hero">
    <div class="kicker" id="kicker"></div>
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
  </section>
  <section class="stats" id="stats"></section>
  <nav class="tabs" id="tabs"></nav>
  <section class="list" id="list"></section>
<script>
const AUTO_MATRIX = `
<div class="card">
  <div class="title">品牌 × 区域示意矩阵</div>
  <p class="insight">格子是相对位置，不是精确市占。深色 = 公开报道更常写成主战场。出海率 = 海外销量 ÷ 集团总销量。</p>
  <div style="overflow:auto;margin-top:12px">
  <table>
    <tr><th></th><th>欧洲</th><th>东南亚</th><th>中东</th><th>拉美</th><th>俄/独联体</th><th>大洋洲</th></tr>
    <tr><td class="l">奇瑞</td><td class="hi">主战场</td><td>布局</td><td class="hi">主战场</td><td class="hi">主战场</td><td class="hi">主战场</td><td class="lo">弱</td></tr>
    <tr><td class="l">比亚迪</td><td class="hi">主战场</td><td class="hi">主战场</td><td>加码</td><td class="hi">主战场</td><td class="lo">谨慎</td><td>加码</td></tr>
    <tr><td class="l">上汽/MG</td><td class="hi">主战场</td><td>回落</td><td>布局</td><td>布局</td><td class="lo">弱</td><td class="hi">主战场</td></tr>
    <tr><td class="l">吉利</td><td>突破</td><td class="hi">主战场</td><td>布局</td><td>加码</td><td class="hi">主战场</td><td>布局</td></tr>
    <tr><td class="l">长安</td><td>加速</td><td class="hi">主战场</td><td>布局</td><td>布局</td><td>布局</td><td class="lo">弱</td></tr>
    <tr><td class="l">长城</td><td>布局</td><td>布局</td><td>布局</td><td class="hi">主战场</td><td>布局</td><td>布局</td></tr>
    <tr><td class="l">新势力观察</td><td>起步</td><td>起步</td><td class="lo">弱</td><td class="lo">弱</td><td class="lo">弱</td><td class="lo">弱</td></tr>
  </table>
  </div>
  <p class="note">公开锚点需回原文：2025 奇瑞出口约 134 万、出海率约一半；比亚迪海外约 105 万；上汽约 107 万。欧洲 2026 年 1–5 月出口公开榜常见顺序：奇瑞、上汽、比亚迪。</p>
</div>`;

const DATA = {
  fin: {
    kicker:"FINLENS", h1:"金镜 · 金融信息情报监测",
    lead:"监管原文定事实，财联社定时效。同一条新闻被三家转载，只留层级最高的那条。精选标准：看完能不能改仓位、合规动作或路演口径。",
    stats:[["L0–L3","信源分层"],["5","主题桶"],["≥80","精选分"],["T+1","更新"]],
    tabs:["每日精选","全部动态","每周精选","本周洞察","市场之声","口径"],
    cards:{
      "每日精选":[
        ["财联社 · 政策","MLF 续做不能只看净投放","净投放是结果，续做比例和利率才是信号。央行操作进 L0，快讯只作时间戳。","政策 / 资金"],
        ["证监会 · 监管","公募费改先改渠道利润表","影响的是代销分成，不是当天指数。精选理由：能改银行渠道话术。","监管 / 渠道"],
        ["交易所 · 公司","中报只留预期差过大的公司","预告相对一致预期偏离过大才进库。没有数字的点评稿降权。","公司"]
      ],
      "全部动态":[
        ["金十 · 宏观","社融结构比总量更重要","总量易被季节因素带偏，结构才能对上行业景气。","宏观"],
        ["东财转载","降权：与财联社重复","同质转载进底库，不进精选。","降权"]
      ],
      "每周精选":[
        ["周报","本周只保留三件事","流动性看续做；监管看费改文本；中报看预期差。其余当噪音。","周度"]
      ],
      "市场之声":[
        ["雪球 / 社群","只记录情绪，不记录事实","散户叙事可以解释交易拥挤，不能当数据源。","L3"]
      ]
    },
    insight:"金镜不追求快，追求少而可执行。卖方晨会可以写二十条，这里每天最多五条。下一条要接的是：把财联社 RSS / 官网快讯做成半自动入库，人工只打分。",
    method:`<div class="card"><div class="title">口径</div>
    <p class="insight">L0 央行、证监会、交易所、财政部原文。<br>L1 财联社、金十、华尔街见闻快讯。<br>L2 东财、同花顺等同质转述，默认降权。<br>L3 雪球、社群，只进市场之声。<br><br>主题桶：政策 / 宏观 / 市场 / 公司 / 资金监管。<br>规则分 = 信源权重 + 实体密度 + 时效 + 可执行性 − 重复转载。<br>80 分以上进每日精选。没有「下一步能做什么」的稿子不出周报。</p></div>`
  },
  sea: {
    kicker:"SEALENS", h1:"海镜 · 出海高价值信息监测",
    lead:"融资稿、政策稿、一线稿分开放。没有国家或区域标签的新闻，不进周报。36氪出海是入口，不是终点。",
    stats:[["8","信源"],["6","主题"],["4","区域桶"],["2条","精选门槛"]],
    tabs:["每日精选","全部动态","每周精选","本周洞察","一线之声","口径"],
    cards:{
      "每日精选":[
        ["36氪出海 · 中东","阿布扎比代表处前移到深圳","这是招商前移，不是品牌稿。可执行点：谁去对接、带什么牌照材料。","中东 / 政策"],
        ["36氪出海 · 一线","非洲光伏文章的价值在账期","装机叙事到处都有。精选留下的是回款周期、售后网络和汇率敞口。","非洲 / 一线"],
        ["商务部 / 海关 · 合规","出口退税与目的国认证要并列","只看国内政策会漏掉对方的认证墙。","合规"]
      ],
      "全部动态":[
        ["平台规则","Temu / TikTok Shop 规则变更","没有费用结构变化的版本更新，不进精选。","平台"],
        ["融资","某品牌完成出海轮","只记金额、领投、是否绑定区域渠道。估值故事降权。","融资"]
      ],
      "每周精选":[
        ["周报","中东看对接，非洲看回款，欧洲看合规","三条对应三类预算：差旅、仓储账期、认证律师费。","周度"]
      ],
      "一线之声":[
        ["社群","一线费用不能写成市场规模","货代、仓储、本地销售提成才是可核对的数。","L3"]
      ]
    },
    insight:"海镜服务的是「下一季度要不要把人派到这个国家」。所以精选必须能改预算。高净值人群出海课题以后作为专题，挂在海镜下，不另起炉灶。",
    method:`<div class="card"><div class="title">口径</div>
    <p class="insight">L0 海关、商务部、目标国公报。<br>L1 36氪、36氪出海。<br>L2 平台规则、协会纪要。<br>L3 一线社群。<br>L4 英文对照稿，用来核事实，不单独精选。<br><br>区域桶：东南亚 / 中东 / 欧美 / 拉美非洲。<br>主题：政策准入、融资、平台、供应链、一线费用、牌照。<br>满足「改变准入、获客、资本、一线费用」中两条，才进精选。</p></div>`
  },
  auto: {
    kicker:"AUTOSEA", h1:"车海 · AI × 汽车出海监测",
    lead:"先分清三个数：海关出口、公司口径海外销量、出海率。AI 负责打标签和对齐单位，不负责发明市占率。",
    stats:[["8","品牌"],["6","区域"],["3","核心指标"],["示意","矩阵 v1"]],
    tabs:["矩阵","品牌观察","区域观察","本周洞察","口径"],
    cards:{
      "品牌观察":[
        ["奇瑞","连续多年乘用车出口第一","2025 出口约 134 万，出海率接近一半。欧洲、中东、拉美、俄区多线，不是单点爆发。","品牌"],
        ["比亚迪","海外占比正在抬升","2025 海外约 105 万。工厂和船队起来后，出口和海外销量会分叉，必须分账。","品牌"],
        ["上汽 / MG","欧洲与澳新基本盘","覆盖国多，高度依赖 MG 单一品牌效能。","品牌"],
        ["吉利 / 长安 / 长城","各自主战场不同","吉利东南亚和俄区更常被写成领跑；长安欧洲在加速；长城看拉美皮卡和 SUV。","品牌"]
      ],
      "区域观察":[
        ["欧洲","认证和关税是硬约束","2026 年 1–5 月公开出口榜常见：奇瑞、上汽、比亚迪。英国与欧盟要分开记。","区域"],
        ["东南亚","本地工厂决定份额能不能稳住","新能源渠道战。有工厂和没工厂，不是同一个「出海」。","区域"],
        ["拉美","巴西是 2026 上半年核心增量之一","本地化与关税政策单列跟踪。","区域"]
      ]
    },
    insight:`车海第一阶段只冻口径。

出口 ≠ 海外销量。出口是海关出港；海外销量包含当地工厂。

出海率默认：海外销量 ÷ 集团总销量。

区域不要写成「海外」。欧洲看认证，东南亚看工厂，中东看招商，拉美看巴西政策，俄区看认证，大洋洲看 MG。

AI 的工作：给稿子打上品牌 / 区域 / 指标类型 / 是否本地化。没有出处的市占率直接丢掉。`,
    method:`<div class="card"><div class="title">车海口径</div>
    <p class="insight">1. 出口量：海关 / 中汽协。<br>2. 海外销量：公司月报或当地上牌，含 CKD / 本地工厂。<br>3. 出海率：海外销量 ÷ 集团总销量。<br><br>品牌池：奇瑞、比亚迪、上汽/MG、吉利、长安、长城；观察位零跑、小鹏、理想、埃安。<br>区域池：欧洲（含英）、东南亚、中东、拉美、俄/独联体、大洋洲。<br>信源：中汽协、海关、乘联分会、盖世出口库、公司月报、ACEA / 当地上牌。<br>媒体只当线索，数字回原表。<br>精确到某国零售市占需要上牌库，v1 先用相对位置矩阵。</p></div>`
  }
};

let sys="fin", tab=0;
function setSys(id){
  sys=id; tab=0;
  const dark = document.body.classList.contains("dark");
  document.body.className = dark ? "dark" : "";
  if(id==="sea") document.body.classList.add("sea");
  if(id==="auto") document.body.classList.add("auto");
  ["fin","sea","auto"].forEach(k=>document.getElementById("b-"+k).classList.toggle("on",k===id));
  render();
}
function render(){
  const d=DATA[sys];
  kicker.textContent=d.kicker; h1.textContent=d.h1; lead.textContent=d.lead;
  stats.innerHTML=d.stats.map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
  tabs.innerHTML=d.tabs.map((t,i)=>`<button class="tab ${i===tab?"on":""}" onclick="tab=${i};render()">${t}</button>`).join("");
  const name=d.tabs[tab];
  if(name==="口径") list.innerHTML=d.method;
  else if(name==="本周洞察") list.innerHTML=`<div class="card"><div class="title">本周洞察</div><div class="insight" style="white-space:pre-line">${d.insight}</div></div>`;
  else if(name==="矩阵") list.innerHTML=AUTO_MATRIX;
  else {
    const arr = d.cards[name] || Object.values(d.cards)[0];
    list.innerHTML=arr.map(c=>`<div class="card"><div class="src">${c[0]}</div><div class="title">${c[1]}</div><div class="insight">${c[2]}</div><div class="tags"><span class="tag">${c[3]}</span></div></div>`).join("");
  }
}
if(location.hash==="#sea") setSys("sea");
else if(location.hash==="#auto") setSys("auto");
else render();
</script>
</body>
</html>
