<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>情报台</title>
  <style>
    :root { --bg:#f6f6f4; --card:#fff; --text:#1c1c1c; --muted:#6b6b6b; --line:#e8e8e4; --accent:#1f4d3a; --tag:#f0efe9; }
    body.sea { --accent:#163a5f; }
    body.auto { --accent:#7a2e12; }
    body.dark { --bg:#121212; --card:#1b1b1b; --text:#eee; --muted:#9a9a9a; --line:#2c2c2c; --tag:#2a2a2a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"PingFang SC","Microsoft YaHei",Helvetica,sans-serif; background:var(--bg); color:var(--text); }
    a { color:inherit; }
    .top { position:sticky; top:0; z-index:20; display:flex; justify-content:space-between; align-items:center; padding:14px 24px; background:var(--bg); border-bottom:1px solid var(--line); }
    .pills { display:flex; gap:8px; flex-wrap:wrap; }
    .pill { border:1px solid var(--line); background:var(--card); padding:6px 12px; border-radius:999px; cursor:pointer; font-size:13px; }
    .pill.on { background:var(--accent); color:#fff; border-color:var(--accent); }
    .hero { max-width:1040px; margin:0 auto; padding:28px 24px 8px; }
    .kicker { color:var(--accent); font-size:12px; letter-spacing:2px; font-weight:600; }
    h1 { font-size:28px; font-weight:560; margin:8px 0 8px; }
    .lead { color:var(--muted); max-width:760px; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:1040px; margin:18px auto; padding:0 24px; }
    .stat { background:var(--card); border:1px solid var(--line); padding:14px; border-radius:12px; }
    .stat b { display:block; font-size:20px; }
    .stat span { color:var(--muted); font-size:12px; }
    .tabs { max-width:1040px; margin:0 auto; padding:0 24px; display:flex; gap:4px; flex-wrap:wrap; }
    .tab { border:0; background:none; padding:8px 12px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; }
    .tab.on { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
    .list { max-width:1040px; margin:16px auto 80px; padding:0 24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
    .src { font-size:12px; color:var(--muted); }
    .title { font-size:16px; font-weight:600; margin:6px 0; }
    .insight { font-size:14px; color:var(--muted); }
    .tags { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
    .tag { font-size:12px; background:var(--tag); padding:2px 8px; border-radius:99px; color:var(--muted); }
    table { width:100%; border-collapse:collapse; font-size:13px; background:var(--card); }
    th,td { border:1px solid var(--line); padding:8px; text-align:center; }
    th { background:var(--tag); font-weight:500; }
    td.l { text-align:left; font-weight:600; }
    .hi { background:#efe7d6; }
    body.dark .hi { background:#3a2a18; }
    .lo { color:var(--muted); }
    .note { font-size:12px; color:var(--muted); margin-top:10px; }
    @media(max-width:720px){ .stats{grid-template-columns:1fr 1fr;} h1{font-size:22px;} }
  </style>
</head>
<body>
  <header class="top">
    <a href="index.html" style="font-weight:650;text-decoration:none">Evo · 情报台</a>
    <div class="pills">
      <button class="pill on" id="b-fin" onclick="setSys('fin')">金镜</button>
      <button class="pill" id="b-sea" onclick="setSys('sea')">海镜</button>
      <button class="pill" id="b-auto" onclick="setSys('auto')">车海</button>
      <button class="pill" onclick="document.body.classList.toggle('dark')">暗色</button>
    </div>
  </header>
  <section class="hero">
    <div class="kicker" id="kicker"></div>
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
  </section>
  <section class="stats" id="stats"></section>
  <nav class="tabs" id="tabs"></nav>
  <section class="list" id="list"></section>

<script>
const AUTO_MATRIX = `
<div class="card">
  <div class="title">品牌 × 区域示意矩阵</div>
  <p class="insight">格子里写的是该品牌在该区域的相对位置，不是精确市占。颜色深 = 公开报道里更常被写成「主战场」。出海率定义见口径说明：海外销量 ÷ 集团总销量，不是出口 ÷ 产量。</p>
  <div style="overflow:auto;margin-top:12px">
  <table>
    <tr><th></th><th>欧洲</th><th>东南亚</th><th>中东</th><th>拉美</th><th>俄/独联体</th><th>大洋洲</th></tr>
    <tr><td class="l">奇瑞</td><td class="hi">主战场</td><td>布局</td><td class="hi">主战场</td><td class="hi">主战场</td><td class="hi">主战场</td><td class="lo">弱</td></tr>
    <tr><td class="l">比亚迪</td><td class="hi">主战场</td><td class="hi">主战场</td><td>加码</td><td class="hi">主战场</td><td class="lo">谨慎</td><td>加码</td></tr>
    <tr><td class="l">上汽/MG</td><td class="hi">主战场</td><td>回落</td><td>布局</td><td>布局</td><td class="lo">弱</td><td class="hi">主战场</td></tr>
    <tr><td class="l">吉利</td><td>突破</td><td class="hi">主战场</td><td>布局</td><td>加码</td><td class="hi">主战场</td><td>布局</td></tr>
    <tr><td class="l">长安</td><td>加速</td><td class="hi">主战场</td><td>布局</td><td>布局</td><td>布局</td><td class="lo">弱</td></tr>
    <tr><td class="l">长城</td><td>布局</td><td>布局</td><td>布局</td><td class="hi">主战场</td><td>布局</td><td>布局</td></tr>
    <tr><td class="l">零跑/新势力</td><td>起步</td><td>起步</td><td class="lo">弱</td><td class="lo">弱</td><td class="lo">弱</td><td class="lo">弱</td></tr>
  </table>
  </div>
  <p class="note">公开锚点（需每期回原文核对，本表不作数据库）：2025 奇瑞出口约 134.4 万、出海率约 48%；比亚迪海外约 105 万、出海率约 23%，2026 年单月海外占比曾升至四成附近；上汽 2025 海外约 107 万。欧洲 2026 年 1–5 月出口公开排名常见顺序：奇瑞、上汽、比亚迪。</p>
</div>`;

const DATA = {
  fin: {
    name:"金镜 FinLens", kicker:"FINLENS", h1:"金融信息情报监测",
    lead:"一线快讯进底库，官方原文定事实，规则分决定谁上精选。",
    stats:[["6","信源层"],["5","主题"],["≥80","精选阈值"],["T+1","日更"]],
    tabs:["每日精选","全部动态","每周精选","本周洞察","市场之声","口径"],
    cards: [
      ["财联社","政策","央行公开市场操作与MLF续做要并列看，而不是只看净投放。"],
      ["证监会","监管","公募费改征求意见影响渠道利润表，不是当天指数。"],
      ["交易所","公司","中报只保留「预告 vs 一致预期」差值过大的公司。"]
    ],
    insight:"本周三条：流动性看续做比例；监管看费改文本；中报看预期差。",
    method:`<div class="card"><div class="title">口径</div><p class="insight">L0 央行/证监会/交易所 → L1 财联社/金十/见闻 → L2 东财等同质转述降权 → L3 雪球只进市场之声。主题：政策 / 宏观 / 市场 / 公司 / 资金监管。规则分 = 信源 + 实体密度 + 时效 + 可执行性 − 重复转载。</p></div>`
  },
  sea: {
    name:"海镜 SeaLens", kicker:"SEALENS", h1:"出海高价值信息监测",
    lead:"融资稿、政策稿、一线稿分开放。没有区域标签的新闻不进周报。",
    stats:[["8","信源"],["6","主题"],["4","区域桶"],["2条","精选门槛"]],
    tabs:["每日精选","全部动态","每周精选","本周洞察","一线之声","口径"],
    cards: [
      ["36氪出海","中东","阿布扎比自贸区代表处落到深圳，是招商前移，不是品牌稿。"],
      ["36氪出海","一线","非洲光伏文章的价值在账期和售后，不在装机叙事。"],
      ["36氪出海","欧洲","中国车在欧洲好卖，必须同时跟踪认证、关税、本地工厂。"]
    ],
    insight:"中东看对接、非洲看回款、欧洲看合规。出海精选必须能改下一季度预算。",
    method:`<div class="card"><div class="title">口径</div><p class="insight">L0 海关/商务部/目标国公报；L1 36氪与36氪出海；L2 平台规则；L3 一线社群；L4 英文对照。区域：东南亚 / 中东 / 欧美 / 拉美非洲。满足「改变准入、获客、资本、一线费用」中两条才进精选。</p></div>`
  },
  auto: {
    name:"车海 AutoSea", kicker:"AUTOSEA", h1:"AI × 汽车出海监测",
    lead:"按国家、市场、品牌拆开。先分清三个容易被混用的数：海关出口、公司口径海外销量、出海率。AI 只负责归类、对齐和写洞察，不负责发明销量。",
    stats:[["8","品牌"],["6","区域"],["3","核心指标"],["示意","矩阵v1"]],
    tabs:["矩阵","品牌观察","区域观察","本周洞察","口径"],
    cards: [
      ["奇瑞","品牌","连续多年乘用车出口第一；2025 出口约 134 万，出海率接近一半；欧洲 + 中东 + 拉美 + 俄区多线。"],
      ["比亚迪","品牌","2025 海外约 105 万、同比大增；2026 年海外占比阶段性走高；东南亚与欧洲、巴西是主战场，并配套海外工厂与船队。"],
      ["上汽 MG","品牌","欧洲与澳新基本盘。出口车型多、覆盖国多，高度依赖 MG 单一品牌效能。"],
      ["欧洲","区域","2026 年 1–5 月公开出口榜常见：奇瑞、上汽、比亚迪。认证与反补贴是这里的真正约束，不是新闻标题。"],
      ["东南亚","区域","新能源渠道战。比亚迪与吉利更常被写成领跑，本地工厂决定能不能稳住份额。"],
      ["拉美","区域","巴西是 2026 上半年出口跃升的核心增量之一；本地化与关税政策必须单列跟踪。"]
    ],
    insight:`车海第一周只做一件事：把口径冻住。

出口 ≠ 海外销量。出口是海关出港；海外销量包含当地工厂。比亚迪泰国/巴西工厂起来之后，这两个数会系统性分叉。

出海率默认用：海外销量 ÷ 集团总销量。不要用出口 ÷ 中国产量冒充出海率。

区域不要写成「海外」。欧洲看认证和关税，东南亚看本地工厂和价格带，中东看招商与能源配套，拉美看巴西政策，俄区看认证与平行进口，大洋洲看 MG 基本盘。

AI 在这里的工作：把一篇稿子打上 品牌 / 区域 / 指标类型 / 是否本地化，并拒绝把营销稿写成销量事实。`,
    method:`<div class="card"><div class="title">车海口径 · 必须先冻结</div>
    <p class="insight"><b>三个指标</b><br>
    1. 出口量：海关 / 中汽协，车离开中国。<br>
    2. 海外销量：公司公告或当地上牌，含 CKD/本地工厂。<br>
    3. 出海率：海外销量 ÷ 集团总销量。单独再记「海外销量 ÷ 中国总销量」作对照，但页面上只突出第一个。</p>
    <p class="insight" style="margin-top:8px"><b>品牌池 v1</b>：奇瑞、比亚迪、上汽/MG、吉利、长安、长城，观察位：零跑、小鹏、理想、广汽埃安。</p>
    <p class="insight" style="margin-top:8px"><b>区域池 v1</b>：欧洲（含英）、东南亚、中东、拉美、俄/独联体、大洋洲。</p>
    <p class="insight" style="margin-top:8px"><b>信源</b>：中汽协、海关、乘联分会/崔东树、盖世出口库、公司月报、ACEA/当地上牌、Marklines。媒体（第一电动、36氪、盖世新闻）只当线索，数字回原表。</p>
    <p class="insight" style="margin-top:8px"><b>AI 做什么</b>：抽品牌、区域、时间、单位（辆/万美元）、是否含本地生产、是否重复报道。不生成没有出处的市占率。</p>
    <p class="insight" style="margin-top:8px"><b>明确暂缓</b>：精确到「某品牌在某国的真实零售市占」需要当地上牌库，v1 先用相对位置矩阵，不假装有完整市占。</p></div>`
  }
};

let sys="fin", tab=0;
function setSys(id){
  sys=id; tab=0;
  document.body.className = document.body.classList.contains("dark") ? "dark" : "";
  if(id==="sea") document.body.classList.add("sea");
  if(id==="auto") document.body.classList.add("auto");
  ["fin","sea","auto"].forEach(k=>document.getElementById("b-"+k).classList.toggle("on",k===id));
  render();
}
function render(){
  const d=DATA[sys];
  kicker.textContent=d.kicker; h1.textContent=d.h1; lead.textContent=d.lead;
  stats.innerHTML=d.stats.map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
  tabs.innerHTML=d.tabs.map((t,i)=>`<button class="tab ${i===tab?"on":""}" onclick="tab=${i};render()">${t}</button>`).join("");
  const last=d.tabs.length-1;
  if(tab===last) list.innerHTML=d.method;
  else if(d.tabs[tab]==="本周洞察") list.innerHTML=`<div class="card"><div class="title">本周洞察</div><div class="insight" style="white-space:pre-line">${d.insight}</div></div>`;
  else if(d.tabs[tab]==="矩阵") list.innerHTML=AUTO_MATRIX;
  else list.innerHTML=d.cards.map(c=>`<div class="card"><div class="src">${c[0]} · ${c[1]}</div><div class="insight">${c[2]}</div></div>`).join("");
}
if(location.hash==="#sea") setSys("sea");
else if(location.hash==="#auto") setSys("auto");
else render();
</script>
</body>
</html>
