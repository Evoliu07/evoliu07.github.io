<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>联系我 · 刘柏廷</title>
<meta name="description" content="联系刘柏廷：机构销售 / 渠道销售岗位机会、项目交流或直接留言。">
<style>
:root{
  --ink:#171411;--muted:#6d6258;--ink2:#3a332c;--paper:#f8f2e7;--paper-deep:#ece1cf;
  --line:#d8c8af;--red:#b9422f;--white:#fffaf0;--surface:rgba(255,250,240,.72);
  --surface-strong:rgba(255,250,240,.94);
  --font-b:"Songti SC","Noto Serif SC",Georgia,serif;
  --font-d:"PingFang SC","Microsoft YaHei",Helvetica,sans-serif;
  --bg:radial-gradient(circle at 20% 8%,rgba(184,137,47,.10),transparent 55%),
       radial-gradient(circle at 82% 0%,rgba(36,95,115,.08),transparent 45%),#f8f2e7;
  --shadow:0 2px 14px rgba(60,45,25,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.85;font-size:16px;
  -webkit-font-smoothing:antialiased}
a{color:var(--red)}
.wrap{max-width:760px;margin:0 auto;padding:26px 22px 52px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-bottom:15px;
  border-bottom:1px solid var(--line);font-family:var(--font-d);font-size:12.5px}
.top a{color:var(--muted);text-decoration:none}
.top a:hover{color:var(--red)}
.brand{color:var(--muted);letter-spacing:.04em}
main{padding:44px 0 0}
.eyebrow{font-family:var(--font-d);font-size:11px;font-weight:750;letter-spacing:.16em;
  text-transform:uppercase;color:var(--red)}
h1{font-family:var(--font-b);font-size:38px;line-height:1.45;font-weight:600;margin:10px 0 12px;
  letter-spacing:-.02em}
.lede{font-family:var(--font-d);font-size:13.5px;line-height:1.95;color:var(--ink2);max-width:620px}
.mail-btn{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:9px 16px;
  border-radius:8px;background:var(--red);color:#fffaf0;text-decoration:none;
  font-family:var(--font-d);font-size:13px;font-weight:650}
.mail-btn:hover{background:var(--ink)}
.panel{margin-top:34px;padding:24px;border:1px solid var(--line);border-radius:16px;
  background:var(--surface);box-shadow:var(--shadow)}
.panel h2{font-family:var(--font-d);font-size:15px;font-weight:700;letter-spacing:.02em}
.panel-sub{font-family:var(--font-d);font-size:12px;line-height:1.8;color:var(--muted);margin:5px 0 18px}
form{display:grid;gap:13px;position:relative}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:6px;font-family:var(--font-d);font-size:11.5px;color:var(--muted)}
input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--surface-strong);
  color:var(--ink);font-family:var(--font-d);font-size:13.5px;line-height:1.65;padding:11px 12px;
  outline:none}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(185,66,47,.08)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
button{border:0;border-radius:9px;background:var(--red);color:#fffaf0;font-family:var(--font-d);
  font-size:13px;font-weight:650;padding:11px 18px;cursor:pointer;justify-self:start}
button:hover{background:var(--ink)}
button:disabled{opacity:.55;cursor:wait}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.note{min-height:22px;font-family:var(--font-d);font-size:11.5px;line-height:1.7;color:var(--muted)}
.note.ok{color:#177A5C}
.note.err{color:var(--red)}
.foot{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:15px;
  border-top:1px solid var(--line);font-family:var(--font-d);font-size:11.5px;color:var(--muted)}
.foot a{color:var(--muted);text-decoration:none}
.foot a:hover{color:var(--red)}
@media(max-width:600px){
  .wrap{padding:20px 18px 42px}
  main{padding-top:32px}
  h1{font-size:30px}
  .row{grid-template-columns:1fr}
  .panel{padding:19px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="index.html">← 返回首页</a>
    <span class="brand">刘柏廷 · Evo</span>
  </header>

  <main>
    <div class="eyebrow">联系我</div>
    <h1>有岗位机会，或想聊项目？</h1>
    <p class="lede">机构销售 / 渠道销售方向的机会、项目交流或具体问题，都可以直接发邮件。想先留一句话，也可以填下面的表单。</p>
    <a class="mail-btn" href="mailto:lbt2238516944@163.com">直接发送邮件 · lbt2238516944@163.com →</a>

    <section class="panel">
      <h2>或者留一句话</h2>
      <p class="panel-sub">留言只用于沟通，不会公开展示。GitHub 版会打开你的邮件客户端发送。</p>
      <form id="contact-form" novalidate>
        <div class="row">
          <label>你的称呼 *
            <input name="name" maxlength="80" autocomplete="name" placeholder="怎么称呼你">
          </label>
          <label>邮箱 / 微信（选填）
            <input name="contact" maxlength="160" autocomplete="email" placeholder="方便回复的联系方式">
          </label>
        </div>
        <label>想聊的岗位、项目或问题 *
          <textarea name="message" maxlength="2000" placeholder="写清楚一点，我会更好回复"></textarea>
        </label>
        <div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
        <button type="submit">发送留言</button>
        <p class="note" id="contact-status" aria-live="polite">你的留言会安全发送，仅我可见。</p>
      </form>
    </section>
  </main>

  <footer class="foot">
    <span>© 2026 刘柏廷 · Evo</span>
    <a href="index.html">返回首页</a>
  </footer>
</div>

<script>
const CLOUD_CFG={"endpoint": "https://boting-portfolio.app.workbuddy.host", "publishableKey": "wbpk_DS2QvHJ5JtCoa6o0UckLhW_YIEhhz0TFVtIbc9hJrEMHyYylamVfo44"};
const EMAIL="lbt2238516944@163.com";
const CLOUD_ORIGIN_HOST="boting-portfolio.app.workbuddy.host";
let cloudClient=null, cloudLoader=null;

function loadCloudSdk(){
  if(window.WorkBuddyCloud)return Promise.resolve();
  if(cloudLoader)return cloudLoader;
  cloudLoader=new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js";
    s.onload=resolve;
    s.onerror=()=>{cloudLoader=null;reject(new Error("CLOUD_SDK_UNAVAILABLE"));};
    document.head.appendChild(s);
  });
  return cloudLoader;
}
async function getCloudClient(){
  if(cloudClient)return cloudClient;
  await loadCloudSdk();
  const factory=window.WorkBuddyCloud&&window.WorkBuddyCloud.createWorkBuddyCloud;
  if(!factory)throw new Error("CLOUD_SDK_UNAVAILABLE");
  cloudClient=factory({endpoint:CLOUD_CFG.endpoint,publishableKey:CLOUD_CFG.publishableKey});
  return cloudClient;
}

const form=document.getElementById("contact-form");
const statusEl=document.getElementById("contact-status");
function say(text,kind){
  statusEl.textContent=text;
  statusEl.className="note"+(kind?" "+kind:"");
}
form.addEventListener("submit",async event=>{
  event.preventDefault();
  const fd=new FormData(form);
  if(String(fd.get("website")||"").trim()){form.reset();return;}
  const name=String(fd.get("name")||"").trim();
  const contact=String(fd.get("contact")||"").trim();
  const message=String(fd.get("message")||"").trim();
  if(!name||message.length<5){say("请填写称呼和至少 5 个字的留言。","err");return;}
  if(location.hostname!==CLOUD_ORIGIN_HOST){
    const subject=encodeURIComponent("来自个人网站的留言 · "+name);
    const nl=String.fromCharCode(10,10);
    const body=encodeURIComponent(message+nl+"联系方式："+(contact||"未填写"));
    window.location.href="mailto:"+EMAIL+"?subject="+subject+"&body="+body;
    say("已打开邮件客户端，直接发送即可。","ok");
    return;
  }
  const btn=form.querySelector('button[type="submit"]');
  btn.disabled=true;btn.textContent="发送中…";say("正在发送…","");
  try{
    const cloud=await getCloudClient();
    const {error}=await cloud.database.from("contact_messages").insert({
      name:name,contact:contact||null,message:message,source_page:"contact"
    });
    if(error)throw error;
    form.reset();
    say("已收到，我会尽快回复你。","ok");
  }catch(err){
    console.error("contact submit failed",err);
    say("发送失败，请直接发邮件到 "+EMAIL+"。","err");
  }finally{
    btn.disabled=false;btn.textContent="发送留言";
  }
});
</script>
</body>
</html>
